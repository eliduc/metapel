<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Тесты движка расчётов</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 20px; background: #f8fafc; }
    h1 { font-size: 20px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #cbd5e1; padding: 6px 10px; font-size: 13px; text-align: left; }
    .pass { background: #dcfce7; }
    .fail { background: #fee2e2; font-weight: bold; }
    #summary { font-size: 16px; font-weight: bold; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Тесты движка расчётов (calc.js)</h1>
  <div id="summary"></div>
  <table id="results">
    <tr><th>#</th><th>Проверка</th><th>Ожидалось</th><th>Получено</th><th></th></tr>
  </table>

  <script src="../js/calc.js"></script>
  <script src="../js/sync.js"></script>
  <script>
    var C = window.MetapelCalc;
    var Sync = window.MetapelSync;
    var results = [];

    function eq(name, actual, expected) {
      results.push({
        name: name,
        actual: JSON.stringify(actual),
        expected: JSON.stringify(expected),
        pass: JSON.stringify(actual) === JSON.stringify(expected)
      });
    }

    function defaults() { return C.defaultSettings(); }
    // базовая механика проверяется без зачёта часов Битуах Леуми
    // (по умолчанию часы не утверждены — зачёт и так 0)
    function noBl() {
      var s = defaults();
      s.bl.approved = false;
      return s;
    }
    // настройки с учтённой суммой от Матав (для проверки зачёта); 6266 — то же
    // значение, что давал прежний расчёт 26 ч × 241 ₪, чтобы суммы совпадали
    function withBl() {
      var s = defaults();
      s.bl.approved = true;
      s.bl.matavAmount = 6266;
      return s;
    }
    function clone(s) { return JSON.parse(JSON.stringify(s)); }
    function occs(today, horizon, settings) {
      return C.generateOccurrences(settings || noBl(), today, horizon == null ? 60 : horizon);
    }
    function find(list, id) {
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    }

    // ---------- календарь ----------
    eq('Суббот в июне 2026 (полный месяц)', C.countSaturdays(2026, 6), 4);
    eq('Суббот в июне 2026 с 10-го числа', C.countSaturdays(2026, 6, 10), 3);
    eq('Суббот в июле 2026', C.countSaturdays(2026, 7), 4);
    eq('diffDays', C.diffDays('2026-07-08', '2026-07-05'), 3);
    eq('addYears 2026-06-10 +1', C.addYears('2026-06-10', 1), '2027-06-10');
    eq('addMonthsISO 2026-06-10 +6 (начало 7-го месяца)', C.addMonthsISO('2026-06-10', 6), '2026-12-10');

    // ---------- зарплата ----------
    var june = occs('2026-06-12');
    var sJun = find(june, 'salary-2026-06');
    eq('Зарплата за июнь: срок', sJun && sJun.dueDate, '2026-07-08');
    // прораторуем нетто по календарным дням КРОМЕ суббот (18/26), субботы отдельно
    eq('Зарплата за июнь: сумма (6500×18/26 + 3×440 = 4500+1320)', sJun && sJun.amount, 5820);
    eq('Зарплата за июнь: суббот посчитано', sJun && sJun.satCount, 3);
    eq('Зарплата за июнь: есть разбивка', sJun && sJun.breakdown.length >= 3, true);
    // реальный случай Григория: сумма от Матав за июнь 840,12 вычитается ЦЕЛИКОМ
    var sJunMatav = (function () { var s = defaults(); s.startDate = '2026-06-10'; s.bl.approved = true; s.bl.matavAmount = 840.12; return s; })();
    eq('Зарплата за июнь − Матав 840,12 целиком: 4500−840,12 + 1320 = 4979,88',
      find(C.generateOccurrences(sJunMatav, '2026-07-06', 60), 'salary-2026-06').amount, 4979.88);

    var july = occs('2026-08-01');
    var sJul = find(july, 'salary-2026-07');
    eq('Зарплата за июль: срок', sJul && sJul.dueDate, '2026-08-08');
    eq('Зарплата за июль: сумма (6500 + 4×440)', sJul && sJul.amount, 8260);

    // ---------- карманные ----------
    var p1 = june.filter(function (o) { return o.type === 'pocket'; })[0];
    eq('Первые карманные: первое воскресенье после 10.06', p1 && p1.id, 'pocket-2026-06-14');
    eq('Карманные: сумма', p1 && p1.amount, 100);

    // ---------- страховка: годовой режим (по умолчанию, оплата раз в год 09.07) ----------
    eq('Помесячной страховки за июль НЕТ (по умолчанию годовой режим)', find(june, 'insurance-2026-07'), null);
    var insA = find(june, 'insurance-2026');
    eq('Страховка годовая: срок = дата продления 09.07', insA && insA.dueDate, '2026-07-09');
    eq('Страховка годовая: сумма 3300 ₪/год', insA && insA.amount, 3300);
    var insNext = find(occs('2027-07-01'), 'insurance-2027');
    eq('Страховка годовая: следующий год — 2027-07-09', insNext && insNext.dueDate, '2027-07-09');
    // продление с якорной датой раньше начала работы пропускается
    var sEarly = noBl();
    sEarly.types.insurance.renewalDate = '2025-07-09';
    var earlyList = occs('2026-07-01', 60, sEarly);
    eq('Страховка годовая: продление до начала работы (2025) пропущено', find(earlyList, 'insurance-2025'), null);
    eq('Страховка годовая: 2026 присутствует при якоре 2025', !!find(earlyList, 'insurance-2026'), true);

    // ---------- страховка: помесячный режим (опция) ----------
    var sMon = noBl();
    sMon.types.insurance.frequency = 'monthly';
    var juneM = occs('2026-06-12', 60, sMon);
    eq('Помесячная: страховки за июнь нет (8.06 раньше начала работы)', find(juneM, 'insurance-2026-06'), null);
    var insM = find(juneM, 'insurance-2026-07');
    eq('Помесячная страховка за июль: срок', insM && insM.dueDate, '2026-07-08');
    eq('Помесячная страховка за июль: сумма', insM && insM.amount, 300);
    // клампинг дня: 31-е число в феврале -> 28-е
    var s31 = noBl();
    s31.types.insurance.frequency = 'monthly';
    s31.types.insurance.dayOfMonth = 31;
    var feb = occs('2027-02-20', 30, s31);
    var insFeb = find(feb, 'insurance-2027-02');
    eq('Помесячная страховка с днём 31 в феврале 2027 -> 28.02', insFeb && insFeb.dueDate, '2027-02-28');

    // ---------- Битуах Леуми ----------
    var bJun = find(june, 'bituach-2026-06');
    eq('Битуах Леуми за июнь (пропорция 21/30 от 231,98)', bJun && bJun.amount, 162.39);
    var bJul = find(july, 'bituach-2026-07');
    eq('Битуах Леуми за июль: 3,6% × 6443,85', bJul && bJul.amount, 231.98);
    eq('Битуах Леуми за июль: срок', bJul && bJul.dueDate, '2026-08-08');

    var sq = noBl();
    sq.types.bituach.frequency = 'quarterly';
    var q = occs('2026-10-01', 30, sq);
    var q2 = find(q, 'bituach-2026-Q2');
    eq('Битуах Леуми 2-й квартал (только июнь): сумма', q2 && q2.amount, 162.39);
    eq('Битуах Леуми 2-й квартал: срок 20.07', q2 && q2.dueDate, '2026-07-20');
    var q3 = find(q, 'bituach-2026-Q3');
    eq('Битуах Леуми 3-й квартал (3 месяца): сумма', q3 && q3.amount, 695.94);
    eq('Битуах Леуми 3-й квартал: срок 20.10', q3 && q3.dueDate, '2026-10-20');
    eq('При квартальной частоте помесячных вхождений нет', find(q, 'bituach-2026-07'), null);

    // ---------- переключение частоты Битуах Леуми не теряет оплат ----------
    var sqSwitch = noBl();
    sqSwitch.types.bituach.frequency = 'quarterly';
    var paidJune = { 'bituach-2026-06': { paidDate: '2026-07-08' } };
    eq('Квартал не требует месяц, уже оплаченный помесячно (Q2 исчезает)',
      find(C.generateOccurrences(sqSwitch, '2026-10-01', 30, paidJune), 'bituach-2026-Q2'), null);
    var paidJuly = { 'bituach-2026-07': { paidDate: '2026-08-08' } };
    var q3sw = find(C.generateOccurrences(sqSwitch, '2026-10-01', 30, paidJuly), 'bituach-2026-Q3');
    eq('Из Q3 исключён оплаченный помесячно июль (сумма за 2 месяца)',
      q3sw && q3sw.amount, 463.96);
    var paidQ3 = { 'bituach-2026-Q3': { paidDate: '2026-10-20' } };
    var backMonthly = C.generateOccurrences(noBl(), '2026-10-01', 30, paidQ3);
    eq('Помесячный июль скрыт, если оплачен квартал Q3',
      find(backMonthly, 'bituach-2026-07'), null);
    eq('Июнь (Q2) при оплаченном Q3 остаётся',
      find(backMonthly, 'bituach-2026-06') !== null, true);

    // ---------- пикадон ----------
    eq('Пикадона за ноябрь 2026 нет (раньше 7-го месяца)',
      find(occs('2026-12-01'), 'pikadon-2026-11'), null);
    var dec = occs('2027-01-05');
    var pik = find(dec, 'pikadon-2026-12');
    eq('Первый пикадон: за декабрь 2026', pik !== null, true);
    eq('Пикадон: срок 8 января 2027', pik && pik.dueDate, '2027-01-08');
    eq('Пикадон: сумма 6,5% + 8,33% от 6443,85 (418,85 + 536,77)', pik && pik.amount, 955.62);

    // ---------- хавраа ----------
    var y2027 = occs('2027-06-01');
    var h1 = find(y2027, 'havraa-1');
    eq('Хавраа за 1-й год: срок (годовщина)', h1 && h1.dueDate, '2027-06-10');
    eq('Хавраа за 1-й год: 5 × 418', h1 && h1.amount, 2090);
    var h2 = find(occs('2028-06-01'), 'havraa-2');
    eq('Хавраа за 2-й год: 6 × 418', h2 && h2.amount, 2508);
    var h4 = find(occs('2030-06-01'), 'havraa-4');
    eq('Хавраа за 4-й год: 7 × 418', h4 && h4.amount, 2926);

    // ---------- виза, тагид, разрешение ----------
    // виза и разрешение ВЫКЛЮЧЕНЫ по умолчанию (виза — только при выезде работника;
    // разрешение для подопечного 85+ продлевается бесплатно)
    eq('Виза выключена по умолчанию (нет visa-2027)', find(y2027, 'visa-2027'), null);
    eq('Разрешение выключено по умолчанию (нет permit-2030)', find(occs('2030-06-01'), 'permit-2030'), null);
    var tg = find(y2027, 'tagid-2027');
    eq('Тагид: сумма', tg && tg.amount, 840);
    // при ручном включении генерируются (виза и разрешение — ежегодно)
    var sVisa = noBl(); sVisa.types.visa.enabled = true;
    var vOn = find(occs('2027-06-01', 60, sVisa), 'visa-2027');
    eq('Виза при включении: срок|сумма', vOn && (vOn.dueDate + '|' + vOn.amount), '2027-06-10|205');
    var sPermit = noBl(); sPermit.types.permit.enabled = true;
    var pmOn = find(occs('2027-06-01', 60, sPermit), 'permit-2027');
    eq('Разрешение при включении: ежегодно (есть permit-2027)', pmOn && pmOn.dueDate, '2027-06-10');

    // ---------- статусы ----------
    var st = defaults();
    function statusAt(today) {
      var o = find(occs(today), 'salary-2026-06');
      return C.getStatus(o, {}, today, st);
    }
    eq('Статус зарплаты 1.07 (за 7 дней, окно 3) = upcoming', statusAt('2026-07-01'), 'upcoming');
    eq('Статус зарплаты 5.07 (за 3 дня) = due', statusAt('2026-07-05'), 'due');
    eq('Статус зарплаты 8.07 (в срок) = due', statusAt('2026-07-08'), 'due');
    eq('Статус зарплаты 9.07 = overdue', statusAt('2026-07-09'), 'overdue');
    var oPaid = find(occs('2026-07-09'), 'salary-2026-06');
    eq('Статус с отметкой об оплате = paid',
      C.getStatus(oPaid, { 'salary-2026-06': { paidDate: '2026-07-08' } }, '2026-07-09', st), 'paid');

    // ---------- зачёт по сумме от Матав (гмлат сиуд) ----------
    eq('Учёт по умолчанию ВЫКЛ', defaults().bl.approved, false);
    eq('Зачёт без суммы от Матав = 0', C.blMonthlyOffset(defaults()), 0);
    eq('Зачёт = сумма от Матав (6266)', C.blMonthlyOffset(withBl()), 6266);
    // пока сумма не указана — выплаты полные
    var fullJuly = C.generateOccurrences(defaults(), '2026-08-01', 60);
    eq('Зарплата без суммы от Матав — полная (6500 + 4×440)',
      find(fullJuly, 'salary-2026-07').amount, 8260);
    eq('Битуах Леуми без суммы — от полной базы',
      find(fullJuly, 'bituach-2026-07').amount, 231.98);
    eq('Хавраа без суммы — полная (5×418)',
      find(C.generateOccurrences(defaults(), '2027-06-01', 60), 'havraa-1').amount, 2090);
    // когда сумма от Матав указана — зачёт применяется
    var blJuly = C.generateOccurrences(withBl(), '2026-08-01', 60);
    var blSal = find(blJuly, 'salary-2026-07');
    eq('Зарплата за июль с зачётом: 6500−6266 + 4×440', blSal && blSal.amount, 1994);
    var blBit = find(blJuly, 'bituach-2026-07');
    eq('Битуах Леуми с зачётом: 3,6% × (6443,85−6266)', blBit && blBit.amount, 6.4);
    var blJune = find(C.generateOccurrences(withBl(), '2026-07-06', 60), 'salary-2026-06');
    // нетто 6500×18/26=4500; Матав 6266 капится по нетто-части (4500) → доплата 0; + шабат 1320
    eq('Частичный июнь: нетто 4500 − зачёт (кап 4500) + 3×440 = 1320', blJune && blJune.amount, 1320);
    var blPik = find(C.generateOccurrences(withBl(), '2027-01-05', 60), 'pikadon-2026-12');
    eq('Пикадон с зачётом: 14,83% × 177,85 (6,5%+8,33%)', blPik && blPik.amount, 26.37);
    var blHav = find(C.generateOccurrences(withBl(), '2027-06-01', 60), 'havraa-1');
    eq('Хавраа — доля семьи 3,6%: 2090 × 0,036', blHav && blHav.amount, 75.24);
    var blNoSoc = withBl();
    blNoSoc.bl.applyToSocial = false;
    var noSocList = C.generateOccurrences(blNoSoc, '2026-08-01', 60);
    eq('Без applyToSocial взносы от полной базы',
      find(noSocList, 'bituach-2026-07').amount, 231.98);
    eq('Зарплата при этом всё равно с зачётом',
      find(noSocList, 'salary-2026-07').amount, 1994);
    // прямая сумма от Матав 2000
    var sMatav = defaults(); sMatav.bl.approved = true; sMatav.bl.matavAmount = 2000;
    eq('Зачёт = сумма от Матав 2000', C.blMonthlyOffset(sMatav), 2000);
    var matSal = find(C.generateOccurrences(sMatav, '2026-08-01', 60), 'salary-2026-07');
    eq('Зарплата с суммой 2000: 6500−2000 + 4×440', matSal && matSal.amount, 6260);
    eq('Разбивка зарплаты упоминает «Матав»',
      matSal.breakdown.join('|').indexOf('Матав') >= 0, true);
    var matBit = find(C.generateOccurrences(sMatav, '2026-08-01', 60), 'bituach-2026-07');
    eq('Битуах с суммой 2000: 3,6%×(6443,85−2000)', matBit && matBit.amount, 159.98);
    // КРИТИЧНО: approved=true БЕЗ суммы (matavAmount=0) → зачёта НЕТ (нет недоплаты,
    // нет отката на устаревший расчёт «часы × ставка»)
    var appNoAmt = defaults(); appNoAmt.bl.approved = true; appNoAmt.bl.matavAmount = 0;
    eq('approved без суммы → зачёт 0 (нет недоплаты)', C.blMonthlyOffset(appNoAmt), 0);
    eq('approved без суммы → зарплата полная',
      find(C.generateOccurrences(appNoAmt, '2026-08-01', 60), 'salary-2026-07').amount, 8260);
    eq('sanitize: approved=true без суммы → approved=false',
      C.sanitizeSettings(appNoAmt).bl.approved, false);
    eq('sanitize: отрицательная сумма → 0',
      C.sanitizeSettings((function () { var s = withBl(); s.bl.matavAmount = -5; return s; })()).bl.matavAmount, 0);
    // кап зачёта по нетто-зарплате: сумма больше нетто не уводит доплату в минус
    var bigMatav = defaults(); bigMatav.bl.approved = true; bigMatav.bl.matavAmount = 7000;
    eq('Сумма 7000 > нетто 6500 → зачёт капится нетто 6500', C.blMonthlyOffset(bigMatav), 6500);
    eq('При зачёте ≥ нетто зарплата НЕ обнуляется (остаётся шабат)',
      find(C.generateOccurrences(bigMatav, '2026-08-01', 60), 'salary-2026-07').amount > 0, true);
    // нетто-зарплата НИЖЕ зачёта: соцзачёт НЕ урезается по net (взносы от настоящего зачёта)
    var lowNet = withBl(); lowNet.types.salary.net = 5000; // < зачёт 6266
    var lowList = C.generateOccurrences(lowNet, '2026-08-01', 60);
    eq('net 5000 < зачёт: Битуах от настоящего зачёта (база 177,85) = 6,40',
      find(lowList, 'bituach-2026-07').amount, 6.4);
    eq('net 5000: зарплатный зачёт капится net → доплата = только шабат (4×440)',
      find(lowList, 'salary-2026-07').amount, 1760);
    var lowPik = find(C.generateOccurrences(lowNet, '2027-01-05', 60), 'pikadon-2026-12');
    eq('net 5000: пикадон от настоящего зачёта = 26,37 (не завышен)', lowPik && lowPik.amount, 26.37);
    // разбивка: при net ниже зачёта строка зачёта остаётся верным равенством
    var lowSal = find(lowList, 'salary-2026-07');
    eq('Разбивка net 5000: есть пометка «в пределах нетто-зарплаты»',
      lowSal.breakdown.join('|').indexOf('в пределах нетто') >= 0, true);
    var defSal = find(C.generateOccurrences(withBl(), '2026-08-01', 60), 'salary-2026-07');
    eq('Разбивка net 6500: прямое вычитание без пометки',
      defSal.breakdown.join('|').indexOf('в пределах нетто') >= 0, false);
    // частичный первый месяц: нетто прораторуется по дням КРОМЕ суббот (18/26),
    // а сумма от Матав в строке «Матав» НЕ прораторуется
    var juneBd = find(C.generateOccurrences(withBl(), '2026-07-06', 60), 'salary-2026-06').breakdown;
    var netLine = juneBd.filter(function (s) { return s.indexOf('Нетто') >= 0; })[0] || '';
    eq('Разбивка частичного месяца: нетто × 18/26 (кроме суббот)',
      netLine.indexOf('18/26') >= 0 && netLine.indexOf('кроме суббот') >= 0, true);
    var blLine = juneBd.filter(function (s) { return s.indexOf('Матав') >= 0; })[0] || '';
    eq('Разбивка частичного месяца: в строке «Матав» НЕТ прорации (сумма целиком)',
      blLine.indexOf('18/26') < 0 && blLine.indexOf('21/30') < 0, true);

    // ---------- калькулятор окончания работы ----------
    eq('monthsBetween: ровно 18 месяцев', C.monthsBetween('2026-06-10', '2027-12-10'), 18);
    var fin = C.calcFinalSettlement(noBl(), '2027-12-10', 'employer', 0);
    // нетто по дням кроме суббот: 6500 × 9/27 = 2166,67 + 1 суббота × 440 = 2606,67
    eq('Финал: зарплата за 10 дней декабря (9 будних) + 1 суббота', fin.breakdown[0].amount, 2606.67);
    eq('Финал: доплата до полного пособия (8,33%×18 мес − 8,33%×12 мес = за первые 6 мес)', fin.breakdown[1].amount, 3220.64);
    eq('Финал: отпуск 21 день × 258', fin.breakdown[2].amount, 5418);
    eq('Финал: хавраа за полгода 2-го года (6×418×50%)', fin.breakdown[3].amount, 1254);
    eq('Финал: пикадон за 10/31 последнего месяца (14,83%)', fin.breakdown[4].amount, 308.27);
    eq('Финал: итого при увольнении работодателем', fin.total, 12807.58);
    var finW = C.calcFinalSettlement(noBl(), '2027-12-10', 'worker', 0);
    eq('Финал: при уходе по собственному желанию доплаты нет', finW.breakdown[1].amount, 0);
    eq('Финал: итого при уходе по собственному желанию', finW.total, 9586.94);
    var finEarly = C.calcFinalSettlement(noBl(), '2026-12-09', 'employer', 0);
    eq('Финал: стаж меньше года — есть предупреждение',
      finEarly.warnings.join(' ').indexOf('меньше года') >= 0, true);

    // ---------- отключение типа ----------
    var sOff = noBl();
    sOff.types.pocket.enabled = false;
    eq('Отключённый тип не генерируется',
      occs('2026-06-12', 60, sOff).filter(function (o) { return o.type === 'pocket'; }).length, 0);

    // ---------- способ оплаты по умолчанию ----------
    // С v6.3 по умолчанию ВСЕ типы — наличные (Григорий платит из рук в руки).
    eq('Карманные по умолчанию — наличные', defaults().types.pocket.defaultMethod, 'cash');
    eq('Зарплата по умолчанию — наличные', defaults().types.salary.defaultMethod, 'cash');
    eq('Пикадон по умолчанию — наличные', defaults().types.pikadon.defaultMethod, 'cash');

    // ---------- ФИО и архив ----------
    eq('ФИО для расписок по умолчанию', defaults().workerFullName, 'Джамшид Эргашев');
    eq('ФИО работодателя для расписок', defaults().employerFullName, 'Григорий Разумовский');
    eq('Архив расписок по умолчанию выключен', defaults().sync.enabled, false);
    eq('Масштаб текста по умолчанию 100%', defaults().uiScale, 100);
    eq('Пароль настроек помнится 10 минут по умолчанию', defaults().passwordTtlMinutes, 10);
    eq('Репозиторий архива по умолчанию', defaults().sync.repo, 'eliduc/metapel-data');

    // ---------- пароль ----------
    eq('Хэш пароля стабилен', C.hashString('1234') === C.hashString('1234'), true);
    eq('Хэш разных паролей различается', C.hashString('1234') !== C.hashString('1235'), true);

    // ---------- автосинхронизация: решение decideSync ----------
    function ds(o) { return Sync.decideSync(o); }
    eq('decideSync: облака нет → defer (пусть пушит)',
      ds({ cloudExists: false }), 'defer');
    eq('decideSync: облако не новее (равно) → defer',
      ds({ cloudExists: true, cloudGen: 3, localGen: 3, localEmpty: false, localHash: 'a', lastHash: 'a' }), 'defer');
    eq('decideSync: облако старше → defer',
      ds({ cloudExists: true, cloudGen: 2, localGen: 4, localEmpty: false, localHash: 'a', lastHash: 'a' }), 'defer');
    eq('decideSync: облако новее, локально пусто → pull (лэптоп-зритель)',
      ds({ cloudExists: true, cloudGen: 5, localGen: 0, localEmpty: true, localHash: 'e', lastHash: null }), 'pull');
    eq('decideSync: облако новее, локально как при синхронизации → pull',
      ds({ cloudExists: true, cloudGen: 5, localGen: 4, localEmpty: false, localHash: 'h', lastHash: 'h' }), 'pull');
    eq('decideSync: облако новее, локально ИЗМЕНЕНО → conflict (не теряем правки)',
      ds({ cloudExists: true, cloudGen: 5, localGen: 4, localEmpty: false, localHash: 'new', lastHash: 'old' }), 'conflict');
    eq('decideSync: облако новее, локально есть данные но НЕ синхронизировались → conflict',
      ds({ cloudExists: true, cloudGen: 5, localGen: 0, localEmpty: false, localHash: 'h', lastHash: null }), 'conflict');
    eq('decideSync: облако новее на 1 после чистой синхронизации → pull',
      ds({ cloudExists: true, cloudGen: 2, localGen: 1, localEmpty: false, localHash: 'x', lastHash: 'x' }), 'pull');

    // ---------- автосинхронизация: localSupersedesCloud (снятие «застревания») ----------
    function ls(cloud, log, extras, returns, timesheets) { return Sync.localSupersedesCloud(cloud, log, extras, returns, timesheets || []); }
    eq('superset: пустое облако накрывается всегда', ls({}, {}, [], []), true);
    eq('superset: одинаковый состав и контент → true',
      ls({ log: { p1: { paidAmount:100, paidDate:'2026-06-14', signatureArchived:true } } },
         { p1: { paidAmount:100, paidDate:'2026-06-14', signatureArchived:true } }, [], []), true);
    eq('superset: ИНЦИДЕНТ — локально p2 подписан, в облаке нет, остальное совпадает → true',
      ls({ log: { p1:{paidAmount:100,paidDate:'2026-06-14',signatureArchived:true}, p2:{paidAmount:100,paidDate:'2026-06-20'} } },
         { p1:{paidAmount:100,paidDate:'2026-06-14',signatureArchived:true}, p2:{paidAmount:100,paidDate:'2026-06-20',signature:'png'} }, [], []), true);
    eq('superset: РАЗНАЯ СУММА того же id → false (не затираем чужую правку)',
      ls({ log: { p1:{paidAmount:8000,paidDate:'2026-07-08',signatureArchived:true} } },
         { p1:{paidAmount:5000,paidDate:'2026-07-08',signatureArchived:true} }, [], []), false);
    eq('superset: разная ДАТА оплаты того же id → false',
      ls({ log: { p1:{paidAmount:100,paidDate:'2026-06-15'} } },
         { p1:{paidAmount:100,paidDate:'2026-06-14'} }, [], []), false);
    eq('superset: облачной записи нет локально → false',
      ls({ log: { p1:{}, p2:{} } }, { p1:{} }, [], []), false);
    eq('superset: ЛОКАЛЬНО лишняя запись (удалена в облаке) → false (не воскрешаем)',
      ls({ log: { p1:{} } }, { p1:{}, p2:{} }, [], []), false);
    eq('superset: облако знает расписку, локально её нет → false',
      ls({ log: { p1:{paidAmount:100,paidDate:'d',signatureArchived:true} } },
         { p1:{paidAmount:100,paidDate:'d'} }, [], []), false);
    eq('superset: облачного extra нет локально → false',
      ls({ extras: [{ id:'e1', amount:50, date:'d' }] }, {}, [], []), false);
    eq('superset: лишний локальный extra (удалён в облаке) → false',
      ls({ extras: [] }, {}, [{ id:'e1', amount:50, date:'d' }], []), false);
    eq('superset: extra — разная сумма → false',
      ls({ extras: [{ id:'e1', amount:50, date:'d' }] }, {}, [{ id:'e1', amount:80, date:'d' }], []), false);
    eq('superset: extra с распиской в облаке, локально нет → false',
      ls({ extras: [{ id:'e1', amount:50, date:'d', signatureArchived:true }] }, {}, [{ id:'e1', amount:50, date:'d' }], []), false);
    eq('superset: облачного возврата нет локально → false',
      ls({ returns: [{ id:'r1' }] }, {}, [], []), false);
    eq('superset: лишний локальный возврат (удалён в облаке) → false',
      ls({ returns: [] }, {}, [], [{ id:'r1' }]), false);
    eq('superset: всё совпадает (extra+возврат) → true',
      ls({ extras:[{id:'e1',amount:50,date:'d',signatureArchived:true}], returns:[{id:'r1'}] },
         {}, [{id:'e1',amount:50,date:'d',signatureArchived:true}], [{id:'r1'}]), true);
    eq('superset: облачный табель есть локально → true',
      ls({ timesheets: [{ id: 't1' }] }, {}, [], [], [{ id: 't1' }]), true);
    eq('superset: облачного табеля нет локально → false',
      ls({ timesheets: [{ id: 't1' }] }, {}, [], [], []), false);
    // ДОБАВЛЕНИЕ табеля локально (в облаке его ещё нет) НЕ должно блокировать заливку —
    // иначе свежезагруженный табель навсегда застревает (вместе с настройками EmailJS).
    eq('superset: ДОБАВЛЕННЫЙ локальный табель (в облаке 0) → true (доносим в облако)',
      ls({ timesheets: [] }, {}, [], [], [{ id: 't1' }]), true);
    eq('superset: cloud вообще без поля timesheets + локально добавлен табель → true',
      ls({}, {}, [], [], [{ id: 't1' }]), true);
    eq('superset: локально все облачные табели + лишний добавленный → true',
      ls({ timesheets: [{ id: 't1' }] }, {}, [], [], [{ id: 't1' }, { id: 't2' }]), true);
    eq('superset: деньги совпали, но локально ДОБАВЛЕН табель → true (не блокирует пуш)',
      ls({ log: { p1:{paidAmount:100,paidDate:'2026-06-14',signatureArchived:true} }, timesheets: [] },
         { p1:{paidAmount:100,paidDate:'2026-06-14',signatureArchived:true} }, [], [], [{ id: 't1' }]), true);

    // ---------- синхронизация общей «суммы от Матав» (sharedSettingsFromCloud) ----------
    function shr(cloudSettings, cloudNewer) { return Sync.sharedSettingsFromCloud(cloudSettings, cloudNewer); }
    // РЕГРЕССИЯ «отката» (v6.1): облако новее → принимаем его сумму, а НЕ оставляем
    // свою устаревшую (иначе устройство затёрло бы новую облачную сумму → переплата)
    eq('shared: облако новее, сумма 4600 → принять {4600, true}',
      shr({ bl:{ matavAmount:4600, approved:true } }, true), { matavAmount:4600, approved:true });
    // облако НЕ новее → null: своя свежая сумма НЕ откатывается к облачной
    eq('shared: облако НЕ новее → null (своя сумма не откатывается)',
      shr({ bl:{ matavAmount:0, approved:false } }, false), null);
    // OFF-состояние (0) тоже распространяется между устройствами
    eq('shared: облако новее, сумма 0 → {0, false} (выкл распространяется)',
      shr({ bl:{ matavAmount:0, approved:false } }, true), { matavAmount:0, approved:false });
    eq('shared: approved приводится к булеву', shr({ bl:{ matavAmount:2000, approved:1 } }, true).approved, true);
    // старый бэкап без bl / без числа → null (не зануляем, не падаем)
    eq('shared: облако без bl (старый бэкап) → null', shr({}, true), null);
    eq('shared: matavAmount не число → null', shr({ bl:{ matavAmount:null } }, true), null);
    eq('shared: cloudSettings отсутствует → null', shr(null, true), null);

    // ---------- табели: статус из флагов ----------
    function tss(rec) { return C.timesheetStatus(rec); }
    eq('timesheetStatus: пусто → unsigned', tss({}), 'unsigned');
    eq('timesheetStatus: подписал метапель → caregiver', tss({ caregiverSigned: true }), 'caregiver');
    eq('timesheetStatus: подписала семья → family', tss({ familySigned: true }), 'family');
    eq('timesheetStatus: оба → full', tss({ caregiverSigned: true, familySigned: true }), 'full');
    eq('timesheetStatus: отослано перекрывает → sent', tss({ caregiverSigned: true, familySigned: true, sentMarked: true }), 'sent');
    eq('timesheetStatus: sent даже без подписей (защитно) → sent', tss({ sentMarked: true }), 'sent');

    // ---------- вывод ----------
    var table = document.getElementById('results');
    var passed = 0;
    results.forEach(function (r, i) {
      var tr = document.createElement('tr');
      tr.className = r.pass ? 'pass' : 'fail';
      tr.innerHTML = '<td>' + (i + 1) + '</td><td>' + r.name + '</td><td>' +
        r.expected + '</td><td>' + r.actual + '</td><td>' + (r.pass ? '✓' : '✗ FAIL') + '</td>';
      table.appendChild(tr);
      if (r.pass) passed++;
    });
    var ok = passed === results.length;
    document.getElementById('summary').textContent =
      (ok ? '✅ ' : '❌ ') + passed + ' / ' + results.length + ' проверок пройдено';
    document.title = (ok ? 'PASS' : 'FAIL') + ' ' + passed + '/' + results.length;
  </script>
</body>
</html>
